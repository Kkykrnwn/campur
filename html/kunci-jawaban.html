        pages.push({ topic: currentTopic, title: currentTitle, items: [...currentQuestions] });
        currentQuestions = [];
      }

  });

  if (lastQuestion) currentQuestions.push(lastQuestion);
  if (currentTitle && currentQuestions.length > 0) {
    pages.push({ topic: currentTopic, title: currentTitle, items: [...currentQuestions] });
  }

  pages.forEach((page, index) => {
    if (!topicsMap[page.topic]) {
      topicsMap[page.topic] = [];
      topicsList.push(page.topic);
    }
    topicsMap[page.topic].push({ title: page.title, index: index });
  });
}

    /* SCRIPT KONTROL DROPDOWN NAVIGASI */
    function toggleDropdown(e) {
      e.stopPropagation();
      document.getElementById('mainDropdown').classList.toggle('active');
    }

    function updateDropdownContent() {
      const currentTopic = topicsList[activeTopicIndex];
      document.getElementById('currentTopicTitle').textContent = currentTopic;

      // Update State Tombol Prev/Next Topik
      document.getElementById('prevTopicBtn').disabled = (activeTopicIndex === 0);
      document.getElementById('nextTopicBtn').disabled = (activeTopicIndex === topicsList.length - 1);

      // Render Daftar Soal Sesuai Topik Aktif
      const itemsList = document.getElementById('dropdownItemList');
      itemsList.innerHTML = '';

      if (topicsMap[currentTopic]) {
        topicsMap[currentTopic].forEach(item => {
          const link = document.createElement('a');
          link.href = '#';
          link.textContent = item.title;
          
          // KLIK SOAL: TUTUP DROPDOWN OTOMATIS & TAMPILKAN HALAMAN SOAL
          link.onclick = (e) => {
            e.preventDefault();
            renderPage(item.index);
            document.getElementById('mainDropdown').classList.remove('active');
          };
          itemsList.appendChild(link);
        });
      }
    }

    // GANTI TOPIK: CEGAH DROPDOWN TERTUTUP (e.stopPropagation)
    function changeTopicNav(e, direction) {
      e.stopPropagation();
      activeTopicIndex += direction;
      if (activeTopicIndex < 0) activeTopicIndex = 0;
      if (activeTopicIndex >= topicsList.length) activeTopicIndex = topicsList.length - 1;
      updateDropdownContent();
    }

    // Menutup dropdown jika mengklik area luar
    document.addEventListener('click', () => {
      document.getElementById('mainDropdown').classList.remove('active');
    });

    /* RENDERING ENGINE HALAMAN */
    function scrollToTop() {
      // Menggunakan requestAnimationFrame agar dipanggil tepat setelah browser selesai render layout
      requestAnimationFrame(() => {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      });
    }

    // 1. HOME

      scrollToTop();
      document.getElementById('mainDropdown').style.display = 'none';
      const card = document.getElementById('appCard');

      card.innerHTML = `
<div class="home-view">

  <div style="font-size: 0.8rem; color: #b91c1c; background: #fef2f2; border-left: 3px solid #ef4444; padding: 0.5rem 0.75rem; margin-bottom: 1.5rem; border-radius: 4px; line-height: 1.4;">
    <strong>Baca Dulu Tol:</strong> Urutan soal dan jawaban dapat berubah sewaktu-waktu. Harap teliti membaca pertanyaan sebelum memilih jawaban dan jangan dongo.

  <button class="btn-start" onclick="renderTOC()">Sini masuk mek &rarr;</button>

  <!-- FOOTER TERINTEGRASI KANAN BAWAH HOME -->
  <footer class="home-footer">
    <span>Dev: <a href="https://instagram.com/kky_krnwn331" target="_blank" rel="noopener noreferrer">ikyy</a></span>
  </footer>
</div>
      `;
    }

    // 2. DAFTAR ISI
    function renderTOC(pushState = true) {
      // Cek apakah navigasi berasal dari dalam halaman soal atau dari Home
      if (pushState) {
        if (location.hash.startsWith('#page-') || location.hash === '#toc') {
          history.replaceState({ view: 'toc' }, '', '#toc');
        } else {
          history.pushState({ view: 'toc' }, '', '#toc');
        }
      }
      scrollToTop();
      document.getElementById('mainDropdown').style.display = 'none';
      const card = document.getElementById('appCard');

      let tocContent = '';

      Object.keys(topicsMap).forEach(topic => {
        let itemsList = topicsMap[topic].map(item => `
          <li class="toc-item" onclick="renderPage(${item.index})">
            <span>${item.title}</span>
            <span style="color:#0284c7;font-weight:bold;">&rarr;</span>
          </li>
        `).join('');

        tocContent += `
          <div class="toc-group">

      card.innerHTML = `
        <div>
          <div class="toc-header">

          </div>

        <div class="controls">
          <button class="nav-btn" onclick="renderHome()">&larr; Kembali ke Home</button>

    }

    // 3. HALAMAN SOAL
    function renderPage(index, pushState = true) {
      if (index < 0 || index >= pages.length) return;
      
      if (pushState) {
        if (location.hash.startsWith('#page-')) {
          history.replaceState({ view: 'page', index: index }, '', `#page-${index}`);
        } else {
          history.pushState({ view: 'page', index: index }, '', `#page-${index}`);
        }
      }
      
      document.getElementById('mainDropdown').style.display = 'block';

      const page = pages[index];
      const card = document.getElementById('appCard');

      activeTopicIndex = topicsList.indexOf(page.topic);
      updateDropdownContent();

      let itemsHTML = page.items.map(item => `
        <div class="item-block">
          <div class="question-text">${item.question}</div>
          <div class="answer-text">Kunci Jawaban: ${item.answer}</div>
        </div>
      `).join('');

      // Render elemen ke DOM dulu
      card.innerHTML = `
        <div>
          <div class="slide-header">
            <span class="topic-tag">${page.topic}</span>
            <h2 class="title-text">${page.title}</h2>
          </div>
          <div class="slide-body">
            ${itemsHTML}
          </div>
        </div>
        <div class="controls">
          <button class="nav-btn" onclick="${index === 0 ? 'renderTOC()' : `renderPage(${index - 1})`}">
            ${index === 0 ? '&larr; Daftar Isi' : '&larr; Sebelumnya'}
          </button>
          <span class="page-indicator">Halaman ${index + 1} dari ${pages.length}</span>
          <button class="nav-btn" onclick="renderPage(${index + 1})" ${index === pages.length - 1 ? 'disabled' : ''}>
            Selanjutnya &rarr;
          </button>
        </div>
      `;

      // DIPINDAHKAN KE SINI: Paksa scroll balik ke paling atas setelah HTML selesai di-render
      scrollToTop();
    }

    document.addEventListener('contextmenu', e => e.preventDefault());

      if (
        e.keyCode === 123 ||

/* ==========================================
   AUDIO ENGINE (ZERO-DELAY / MEMORY BUFFER)
   ========================================== */

// 1. Ganti URL audio kamu di sini
const SOUND_ENTRANCE_URL = '../mp3/ayam.mp3'; 
const SOUND_UNIVERSAL_URL = '../mp3/ah.mp3'; 

// Inisialisasi AudioContext & Storage Buffer Memori
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();

let bufferEntrance = null;
let bufferUniversal = null;

// Fungsi Load & Decode Audio ke Memori RAM
async function loadAudioToBuffer(url) {
  try {
    const response = await fetch(url);
    const arrayBuffer = await response.arrayBuffer();
    return await audioCtx.decodeAudioData(arrayBuffer);
  } catch (e) {
    return null;
  }
}

// LOAD PAKSA SEJAK HALAMAN DIBUKA (TANPA TUNGGU DI-KLIK)
(async function preloadAllAudio() {
  bufferEntrance = await loadAudioToBuffer(SOUND_ENTRANCE_URL);
  bufferUniversal = await loadAudioToBuffer(SOUND_UNIVERSAL_URL);
})();

// FUNGSI PLAY LANGSUNG DARI RAM (ZERO DELAY)
function playInstantSound(buffer, volumeMultiplier) {
  if (!buffer) return;

  // Aktifkan AudioContext jika terlelap oleh aturan autoplay browser
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  // Buat node audio langsung dari memori RAM
  const source = audioCtx.createBufferSource();
  const gainNode = audioCtx.createGain();

  source.buffer = buffer;

  // Set Pengali Volume (Multiplier)
  // Base volume 0.35 agar saat dikali 2 atau 3 suaranya nyaring tapi tidak pecah/clip
  gainNode.gain.value = 0.35 * volumeMultiplier;

  // Sambungkan Node Audio: Source -> Gain (Volume) -> Speaker
  source.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  // Mainkan secara instan detik 0.000
  source.start(0);
}

/* ==========================================
   EVENT LISTENER & FILTER TOMBOL
   ========================================== */

// Buka kunci AudioContext saat ada sentuhan pertama di layar
const unlockAudio = () => {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  window.removeEventListener('pointerdown', unlockAudio);
  window.removeEventListener('touchstart', unlockAudio);
};
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('touchstart', unlockAudio);

// Handler Klik Utama
document.addEventListener('click', (e) => {
  // IGNORE: Dropdown 'pilih materi' dan semua isinya
  if (e.target.closest('#mainDropdown')) {
    return;
  }

  // SOUND 1: Tombol "Sini masuk mek" (Volume x2)
  if (e.target.closest('.btn-start')) {
    playInstantSound(bufferEntrance, 2);
    return;
  }

  // SOUND 2: Tombol Universal (Volume x3)
  const isUniversalBtn = e.target.closest('button, .toc-item, .brand');
  if (isUniversalBtn) {
    playInstantSound(bufferUniversal, 3);
  }
}, true);

    /* HANDLER TOMBOL BACK DEVICE / BROWSER */
    window.addEventListener('popstate', (e) => {
      // Jika dropdown lagi kebuka pas di-back, tutup dropdown-nya dulu
      const dropdown = document.getElementById('mainDropdown');
      if (dropdown && dropdown.classList.contains('active')) {
        dropdown.classList.remove('active');
      }

      // Jika posisi back ditekan dari dalam halaman soal mana pun, paksa ke Daftar Isi
      if (e.state && e.state.view === 'page') {
        renderTOC(false);
      } else if (e.state && e.state.view === 'toc') {
        renderTOC(false);
      } else {
        renderHome(false);
      }
    });

    /* INISIALISASI (Disesuaikan untuk Replace State Awal) */
    window.addEventListener('DOMContentLoaded', () => {
      parseMarkdown(rawData);
      updateDropdownContent();
      // Set State awal ke 'home' tanpa menambah tumpukan riwayat baru
      history.replaceState({ view: 'home' }, '', '#home');
      renderHome(false);
    });
